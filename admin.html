<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SK Perfumes — Admin</title><style>
:root{--bg:#0e0d0b;--panel:#171512;--line:#332f28;--cream:#f4eee2;--muted:#a79f91;--gold:#c9a66b;--danger:#b86d63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:14px Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.brand{font-family:Georgia,serif;font-size:30px}.brand small{display:block;font:9px Arial;letter-spacing:.25em;color:var(--gold);margin-top:4px}.btn{background:var(--gold);border:0;padding:11px 16px;color:#17120d;font-weight:700}.btn.alt{background:transparent;color:var(--cream);border:1px solid var(--line)}.login{max-width:420px;margin:12vh auto;background:var(--panel);padding:35px;border:1px solid var(--line)}.login h1{font:36px Georgia;margin:0 0 8px}.muted{color:var(--muted)}.field{margin:16px 0}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:7px}.field input,.field select,.field textarea{width:100%;background:#0b0a09;color:var(--cream);border:1px solid var(--line);padding:12px;outline:none}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}.stat{background:var(--panel);border:1px solid var(--line);padding:18px}.stat b{display:block;font-size:25px;margin-top:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.toolbar input,.toolbar select{background:var(--panel);border:1px solid var(--line);color:var(--cream);padding:11px}.orders{display:grid;gap:12px}.order{background:var(--panel);border:1px solid var(--line);padding:18px}.orderhead{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.orderid{color:var(--gold);font-weight:700}.status{padding:6px 9px;border:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.ordergrid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:20px;margin-top:16px}.items{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}.item{display:flex;justify-content:space-between;padding:6px 0}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}.actions select{background:#0b0a09;color:var(--cream);border:1px solid var(--line);padding:8px}.error{color:#ef9a90;margin-top:10px}.hidden{display:none!important}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.ordergrid{grid-template-columns:1fr}.wrap{padding:18px}.top{align-items:flex-start}}
</style></head><body><div id="loginView" class="login"><h1>SK Perfumes</h1><p class="muted">Private order dashboard.</p><div class="field"><label>Admin password</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">SIGN IN</button><div id="loginError" class="error"></div></div>
<div id="app" class="wrap hidden"><div class="top"><div class="brand">SK <span style="color:var(--gold)">PERFUMES</span><small>ORDER DASHBOARD</small></div><button class="btn alt" onclick="logout()">LOG OUT</button></div><div class="grid"><div class="stat">All orders<b id="sTotal">0</b></div><div class="stat">New<b id="sNew">0</b></div><div class="stat">Confirmed<b id="sConfirmed">0</b></div><div class="stat">Delivered<b id="sDelivered">0</b></div><div class="stat">Order value<b id="sRevenue">Rs. 0</b></div></div><div class="toolbar"><input id="search" placeholder="Search order, customer, phone..." oninput="loadOrders()"><select id="statusFilter" onchange="loadOrders()"><option value="all">All statuses</option><option>new</option><option>confirmed</option><option>packed</option><option>shipped</option><option>delivered</option><option>cancelled</option><option>returned</option></select><button class="btn alt" onclick="refresh()">REFRESH</button></div><div id="orders" class="orders"></div></div>
<script>
const money=n=>'Rs. '+Number(n).toLocaleString('en-PK');
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(r.status===401){showLogin();throw new Error('Unauthorized')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
async function login(){const p=document.getElementById('password').value;document.getElementById('loginError').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({password:p})});showApp();await refresh()}catch(e){document.getElementById('loginError').textContent=e.message}}
async function logout(){await fetch('/api/logout',{method:'POST'});showLogin()}
function showLogin(){document.getElementById('loginView').classList.remove('hidden');document.getElementById('app').classList.add('hidden')}
function showApp(){document.getElementById('loginView').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
async function refresh(){await loadStats();await loadOrders()}
async function loadStats(){try{const s=await api('/api/stats');sTotal.textContent=s.total;sNew.textContent=s.new;sConfirmed.textContent=s.confirmed;sDelivered.textContent=s.delivered;sRevenue.textContent=money(s.revenue)}catch(e){}}
async function loadOrders(){try{const q=document.getElementById('search').value.trim(),status=document.getElementById('statusFilter').value;const d=await api('/api/orders?'+new URLSearchParams({q,status}));render(d.orders)}catch(e){if(e.message==='Unauthorized')return;orders.innerHTML='<p class="muted">'+e.message+'</p>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(list){orders.innerHTML=list.length?list.map(o=>`<div class="order"><div class="orderhead"><div><span class="orderid">${esc(o.id)}</span><div class="muted">${new Date(o.created_at).toLocaleString()}</div></div><span class="status">${esc(o.status)}</span></div><div class="ordergrid"><div><b>Customer</b><p>${esc(o.customer_name)}<br>${esc(o.customer_phone)}<br>${esc(o.customer_city)}</p><b>Address</b><p>${esc(o.customer_address)}</p></div><div><b>Items</b><div class="items">${o.items.map(i=>`<div class="item"><span>${esc(i.name)} × ${i.qty}</span><span>${money(i.lineTotal)}</span></div>`).join('')}</div><p><strong>Total: ${money(o.subtotal)}</strong></p></div><div><b>Payment</b><p>${esc(o.payment_method)}</p><div class="actions"><select id="st-${esc(o.id)}"><option value="new">New</option><option value="confirmed">Confirmed</option><option value="packed">Packed</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option><option value="returned">Returned</option></select><button class="btn" onclick="updateStatus('${esc(o.id)}')">SAVE</button></div><p class="muted">You can copy the customer phone/address from this order for fulfillment.</p></div></div></div>`).join(''):'<p class="muted">No orders found.</p>';list.forEach(o=>{const el=document.getElementById('st-'+o.id);if(el)el.value=o.status})}
async function updateStatus(id){const status=document.getElementById('st-'+id).value;try{await api('/api/orders/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});await refresh()}catch(e){alert(e.message)}}
(async()=>{try{const r=await fetch('/api/stats');if(r.ok){showApp();await refresh()}}catch(e){}})();
</script></body></html>
